<style>
:root{color-scheme:light dark;--bg:#f3f9f5;--card:#fff;--ink:#10241b;--mut:#587064;--line:#dbe8e0;--ac:#0d5f43;--soft:#e6f4ec;--on:#fff;--h1:#0b5a40;--h2:#1f9d6b;--err:#b23a3a;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a110e;--card:#121c17;--ink:#eaf4ee;--mut:#9fb5a8;--line:#22332a;--ac:#58c99c;--soft:#16271f;--on:#07140e;--err:#f08a8a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
.scr{display:none;min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 28px) 22px calc(env(safe-area-inset-bottom,0px) + 28px);max-width:460px;margin:0 auto;flex-direction:column}
.scr.on{display:flex}

/* Splash */
#splash{position:fixed;inset:0;max-width:none;margin:0;z-index:20;background:radial-gradient(circle at 50% 40%,#0b2a1a 0%,#031009 72%);align-items:center;justify-content:center;gap:20px;color:#fff;--tzn:#f2f7f3;--tza:#7bea55;transition:opacity .6s,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
#splash p{margin:0;opacity:.78;font-size:.95rem;color:#cfe9d8;animation:fi .8s 1.1s both}
#splash .tzs{position:relative;z-index:1}
#splash .tzg{position:absolute;left:50%;top:42%;width:min(86vw,380px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(110,242,42,.15),rgba(110,242,42,0) 62%);animation:tzGlow 3.6s ease-in-out infinite;pointer-events:none}
#splash .tzmk{animation:tzIn .95s cubic-bezier(.2,.75,.2,1) both}
#splash .tzn{animation:tzFade .75s .35s cubic-bezier(.2,.75,.2,1) both}
#splash .tza{animation:tzFade .75s .6s cubic-bezier(.2,.75,.2,1) both}
@keyframes tzIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes tzFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes tzGlow{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0}to{opacity:1}}

/* Auth */
.top{display:flex;flex-direction:column;align-items:center;gap:16px;margin:10px 0 28px;text-align:center}
.top p{margin:0;color:var(--mut);font-size:.95rem}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:16px;padding:4px;margin-bottom:20px}
.tabs i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--card);border-radius:12px;box-shadow:0 2px 10px rgba(13,95,67,.14);transition:transform .3s cubic-bezier(.3,.8,.3,1)}
.tabs.reg i{transform:translateX(100%)}
.tabs button{position:relative;z-index:1;background:none;border:0;padding:11px;font-weight:600;color:var(--mut);cursor:pointer;border-radius:12px;transition:color .2s}
.tabs button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 28px rgba(13,95,67,.07)}
label{display:block;font-size:.88rem;color:var(--mut);font-weight:500;margin:0 0 6px}
.f{margin-bottom:16px}
.in{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.in.bad{border-color:var(--err)}
.row{display:flex;gap:10px}
.row .in{flex:1;min-width:0}
.otp{letter-spacing:.35em;text-align:center;font-weight:600;font-size:1.1rem}
.snd{flex:none;background:var(--soft);color:var(--ac);border:0;border-radius:14px;padding:0 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.snd:disabled{opacity:.55;cursor:default}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;margin-top:6px;font-weight:600;font-size:1.05rem;color:#fff;background:linear-gradient(145deg,var(--h1),var(--h2));cursor:pointer;box-shadow:0 8px 20px rgba(13,95,67,.25);transition:transform .15s}
.btn:active{transform:scale(.98)}
.msg{min-height:1.4em;margin:0 0 10px;font-size:.88rem;color:var(--err)}
.msg.ok{color:var(--ac)}
.hint{text-align:center;color:var(--mut);font-size:.82rem;margin:16px 4px 0}

/* Profile */
.ph{margin:10px 0 22px}
.ph h2{margin:0 0 4px;font-size:1.4rem;font-weight:600}
.ph p{margin:0;color:var(--mut);font-size:.95rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;font-weight:500;transition:all .2s}
.seg button.on{background:var(--soft);border-color:var(--ac);color:var(--ac);font-weight:600}

/* Done */
#done{align-items:center;justify-content:center;text-align:center;gap:14px}
.ck{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--h1),var(--h2));box-shadow:0 10px 28px rgba(13,95,67,.3)}
#done h2{margin:6px 0 0;font-size:1.4rem}
#done p{margin:0;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.m2{margin-bottom:18px}
.or{display:flex;align-items:center;gap:12px;margin:16px 0 12px;color:var(--mut);font-size:.82rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:13px;font-weight:600;cursor:pointer;transition:transform .15s}
.gbtn:active{transform:scale(.98)}

<!-- Splash -->
<section class="scr on" id="splash" role="img" aria-label="Tazkiyah · تزكية">
  <div class="tzg"></div>
  <div class="tzs" style="--s:clamp(23px,6.9vw,30px)"><svg class="tzmk" viewBox="40 10 120 170" aria-hidden="true"><use href="#tzm-d"/></svg><div class="tzw"><span class="tzn">TAZKIYAH</span><svg class="tza" viewBox="0 0 138.78 65.71" aria-hidden="true"><use href="#tzar"/></svg></div></div>
  <p>আত্মশুদ্ধির পথে প্রতিদিন</p>
</section>

<!-- Login / Registration -->
<section class="scr" id="auth">
  <div class="top">
    <div class="tzs" style="--s:15px" role="img" aria-label="Tazkiyah · تزكية"><span class="tzt" style="display:contents"><svg class="tzmk lt" viewBox="40 10 120 170" aria-hidden="true"><use href="#tzm-l"/></svg><svg class="tzmk dk" viewBox="40 10 120 170" aria-hidden="true"><use href="#tzm-d"/></svg></span><div class="tzw"><span class="tzn">TAZKIYAH</span><svg class="tza" viewBox="0 0 138.78 65.71" aria-hidden="true"><use href="#tzar"/></svg></div></div>
    <p id="sub">আবার স্বাগতম</p>
  </div>
  <div class="tabs" id="tabs"><i></i>
    <button class="on" data-m="login">লগ ইন</button>
    <button data-m="reg">রেজিস্ট্রেশন</button>
  </div>
  <div class="card">
    <div class="seg m2" id="chs"><button type="button" data-c="phone" class="on">ফোন</button><button type="button" data-c="mail">ইমেইল</button></div>
    <div id="phoneBox">
      <div class="f"><label for="ct">ফোন নম্বর</label>
        <input class="in" id="ct" type="tel" autocomplete="tel" inputmode="tel" placeholder="01XXXXXXXXX"></div>
      <div class="f"><label for="otp">OTP</label>
        <div class="row"><input class="in otp" id="otp" inputmode="numeric" maxlength="6" placeholder="······" autocomplete="one-time-code">
        <button class="snd" id="snd" type="button">OTP পাঠান</button></div></div>
    </div>
    <div id="mailBox" style="display:none">
      <div class="f"><label for="em">ইমেইল</label>
        <input class="in" id="em" type="email" autocomplete="email" inputmode="email" placeholder="name@mail.com"></div>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <button class="btn" id="go" type="button">লগ ইন করুন</button>
    <div class="or"><span>অথবা</span></div>
    <button class="gbtn" id="gg" type="button"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.5-4.7 7.2l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Google দিয়ে চালিয়ে যান</button>
  </div>
  <p class="hint" id="hint">নতুন হলে উপরে “রেজিস্ট্রেশন” চাপুন।</p>
</section>

<!-- Profile -->
<section class="scr" id="prof">
  <div class="top" style="margin-bottom:10px;font-size:58px"><span class="tzt" style="display:contents"><svg class="tzmk lt" viewBox="40 10 120 170" aria-hidden="true"><use href="#tzm-l"/></svg><svg class="tzmk dk" viewBox="40 10 120 170" aria-hidden="true"><use href="#tzm-d"/></svg></span></div>
  <div class="ph"><h2>প্রোফাইল সম্পন্ন করুন</h2><p>আপনার সম্পর্কে কয়েকটি তথ্য দিন।</p></div>
  <div class="card">
    <div class="f"><label for="nm">নাম</label><input class="in" id="nm" autocomplete="name" placeholder="আপনার পূর্ণ নাম"></div>
    <div class="f"><label for="ag">বয়স</label><input class="in" id="ag" inputmode="numeric" maxlength="3" placeholder="যেমন: ২৫"></div>
    <div class="f"><label>লিঙ্গ</label><div class="seg" data-k="gender"><button type="button" data-v="পুরুষ">পুরুষ</button><button type="button" data-v="মহিলা">মহিলা</button></div></div>
    <div class="f"><label>বিয়ের স্ট্যাটাস</label><div class="seg" data-k="marital"><button type="button" data-v="বিবাহিত">বিবাহিত</button><button type="button" data-v="অবিবাহিত">অবিবাহিত</button></div></div>
    <p class="msg" id="pmsg" role="status" aria-live="polite"></p>
    <button class="btn" id="save" type="button">সম্পন্ন করুন</button>
  </div>
</section>

<!-- Done -->
<section class="scr" id="done">
  <div class="ck"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h2 id="dn">স্বাগতম</h2>
  <p>আপনার প্রোফাইল প্রস্তুত।</p>
  <button class="btn" id="enter" type="button" style="max-width:300px;margin-top:14px">অ্যাপে প্রবেশ করুন</button>
</section>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,RecaptchaVerifier,signInWithPhoneNumber,GoogleAuthProvider,signInWithPopup,sendSignInLinkToEmail,isSignInWithEmailLink,signInWithEmailLink,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Firebase config (Tazkiyah-v01) */
const firebaseConfig={
  apiKey:"AIzaSyBIXppkMrN2I56U9luVXRvoeGKl53sUKsQ",
  authDomain:"tazkiyah-v01.firebaseapp.com",
  projectId:"tazkiyah-v01",
  storageBucket:"tazkiyah-v01.firebasestorage.app",
  messagingSenderId:"108876799499",
  appId:"1:108876799499:web:7b29e186158e4b1ee3b10e"
};
/* ফোন OTP-তে আসল SMS পাঠাতে Blaze প্ল্যান লাগে। বন্ধ রাখতে false করুন, তখন শুধু ইমেইল ও Google থাকবে। */
const PHONE_ENABLED=true;

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
auth.languageCode="bn";

const $=id=>document.getElementById(id);
const bn=s=>String(s).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const en=s=>String(s).replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let mode="login",ch="phone",confirmation=null,timer=0,verifier=null,user=null,prof={gender:"",marital:""};

function show(id){document.querySelectorAll(".scr").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo(0,0)}
function say(t,ok){const m=$("msg");m.textContent=t;m.className="msg"+(ok?" ok":"")}
function phone(v){const p=en(v).replace(/[\s-]/g,"");return /^(\+?880)?0?1[3-9]\d{8}$/.test(p)?"+880"+p.replace(/^\+?880/,"").replace(/^0/,""):""}
const ERR={"auth/invalid-phone-number":"ফোন নম্বরটি সঠিক নয়।","auth/too-many-requests":"অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পর আবার চেষ্টা করুন।","auth/invalid-verification-code":"OTP মিলছে না। আবার চেষ্টা করুন।","auth/code-expired":"OTP-র সময় শেষ। আবার পাঠান।","auth/captcha-check-failed":"যাচাই ব্যর্থ হয়েছে। পেজ রিফ্রেশ করে চেষ্টা করুন।","auth/billing-not-enabled":"আসল নম্বরে SMS পাঠাতে Blaze প্ল্যান লাগে। এখন টেস্ট নম্বর, ইমেইল বা Google ব্যবহার করুন।","auth/network-request-failed":"ইন্টারনেট সংযোগ পরীক্ষা করুন।","auth/unauthorized-domain":"এই ডোমেইন Firebase-এর Authorized domains-এ যোগ করুন।","auth/popup-closed-by-user":"Google লগ ইন বাতিল হয়েছে।","auth/invalid-action-code":"লিংকটি মেয়াদোত্তীর্ণ বা আগেই ব্যবহৃত। নতুন লিংক নিন।","auth/operation-not-allowed":"Firebase Console-এ এই পদ্ধতিটি চালু করুন।","auth/invalid-email":"সঠিক ইমেইল দিন।"};
const eMsg=e=>ERR[e.code]||("সমস্যা হয়েছে: "+(e.code||e.message));

/* অদৃশ্য reCAPTCHA: ব্যবহারকারী কিছুই দেখবেন না */
function mkVerifier(){if(!PHONE_ENABLED)return;try{verifier&&verifier.clear()}catch(e){}verifier=new RecaptchaVerifier(auth,"snd",{size:"invisible"})}
mkVerifier();

/* পদ্ধতি বদল: ফোন | ইমেইল */
function setCh(c){ch=c;$("phoneBox").style.display=c==="phone"?"":"none";$("mailBox").style.display=c==="mail"?"":"none";
  [...$("chs").children].forEach(b=>b.classList.toggle("on",b.dataset.c===c));say("");label()}
function label(){$("go").textContent=ch==="mail"?"লগ ইন লিংক পাঠান":mode==="reg"?"অ্যাকাউন্ট খুলুন":"লগ ইন করুন"}
$("chs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setCh(b.dataset.c)});
if(!PHONE_ENABLED){$("chs").children[0].style.display="none";$("chs").style.gridTemplateColumns="1fr";setCh("mail")}

/* Splash শেষ হওয়া ও লগ ইন অবস্থা জানার পর পেজ ঠিক হবে */
let splashDone=false,authKnown=false;
async function route(){if(!splashDone||!authKnown)return;
  $("splash").classList.add("out");{const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.setAttribute("content","#0b5a40")}setTimeout(()=>$("splash").style.display="none",700);
  if(!user)return show("auth");
  const p=await loadProfile();
  if(p)finish(p);else{if(!$("nm").value)$("nm").value=user.displayName||"";show("prof")}}
setTimeout(()=>{splashDone=true;route()},2600);
onAuthStateChanged(auth,u=>{user=u;authKnown=true;route()});
async function loadProfile(){try{const d=await getDoc(doc(db,"users",user.uid));return d.exists()&&d.data().name?d.data():null}catch(e){return null}}

/* ইমেইল লিংক চাপা হলে এখানে লগ ইন সম্পন্ন হবে */
(async()=>{if(!isSignInWithEmailLink(auth,location.href))return;
  let em=ls.get("tz_email")||prompt("নিশ্চিত করতে আপনার ইমেইল লিখুন")||"";
  try{await signInWithEmailLink(auth,em.trim(),location.href);ls.del("tz_email")}
  catch(e){authKnown=true;say(eMsg(e))}
  history.replaceState(null,"",location.pathname)})();

/* লগ ইন | রেজিস্ট্রেশন ট্যাব */
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.m;
  $("tabs").classList.toggle("reg",mode==="reg");
  [...$("tabs").querySelectorAll("button")].forEach(x=>x.classList.toggle("on",x===b));
  $("sub").textContent=mode==="reg"?"নতুন অ্যাকাউন্ট খুলুন":"আবার স্বাগতম";
  $("hint").textContent=mode==="reg"?"আগে থেকেই অ্যাকাউন্ট থাকলে “লগ ইন” চাপুন।":"নতুন হলে উপরে “রেজিস্ট্রেশন” চাপুন।";
  $("otp").value="";say("");label()});

/* ফোন: OTP পাঠান */
$("snd").onclick=async()=>{
  const c=phone($("ct").value);$("ct").classList.toggle("bad",!c);
  if(!c)return say("সঠিক ফোন নম্বর দিন (01XXXXXXXXX)।");
  $("snd").disabled=true;say("OTP পাঠানো হচ্ছে…",true);
  try{
    confirmation=await signInWithPhoneNumber(auth,c,verifier);
    say(bn(c)+" নম্বরে OTP পাঠানো হয়েছে।",true);
    let n=60;$("snd").textContent=bn(n)+" সে.";clearInterval(timer);
    timer=setInterval(()=>{if(--n<0){clearInterval(timer);$("snd").disabled=false;$("snd").textContent="আবার পাঠান"}else $("snd").textContent=bn(n)+" সে."},1000);
    $("otp").focus();
  }catch(e){say(eMsg(e));$("snd").disabled=false;mkVerifier()}};

/* মূল বাটন: ফোনে OTP যাচাই, ইমেইলে লিংক পাঠানো */
$("go").onclick=async()=>{
  if(ch==="phone"){
    const o=en($("otp").value.trim());
    if(!confirmation)return say("আগে “OTP পাঠান” চাপুন।");
    if(o.length!==6)return say("৬ সংখ্যার OTP দিন।");
    $("go").disabled=true;
    try{await confirmation.confirm(o)}catch(e){$("otp").classList.add("bad");say(eMsg(e))}
    $("go").disabled=false;return}
  const em=$("em").value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){$("em").classList.add("bad");return say("সঠিক ইমেইল দিন।")}
  $("em").classList.remove("bad");$("go").disabled=true;say("লিংক পাঠানো হচ্ছে…",true);
  try{
    await sendSignInLinkToEmail(auth,em,{url:location.origin+location.pathname,handleCodeInApp:true});
    ls.set("tz_email",em);
    say("লিংক পাঠানো হয়েছে: "+em+"। ইনবক্স (ও স্প্যাম) দেখে লিংকে চাপুন।",true);
    let n=30;const t=setInterval(()=>{$("go").textContent=bn(n)+" সে. পর আবার পাঠান";if(--n<0){clearInterval(t);$("go").disabled=false;label()}},1000);
  }catch(e){say(eMsg(e));$("go").disabled=false}};
$("otp").addEventListener("input",e=>e.target.classList.remove("bad"));

/* Google */
$("gg").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){say(eMsg(e))}};

/* প্রোফাইল */
document.querySelectorAll("#prof .seg").forEach(g=>g.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  prof[g.dataset.k]=b.dataset.v;[...g.children].forEach(x=>x.classList.toggle("on",x===b))}));
$("save").onclick=async()=>{
  const name=$("nm").value.trim(),age=+en($("ag").value),pm=$("pmsg");
  const err=!name?"আপনার নাম লিখুন।":!(age>=5&&age<=120)?"সঠিক বয়স লিখুন।":!prof.gender?"লিঙ্গ বেছে নিন।":!prof.marital?"বিয়ের স্ট্যাটাস বেছে নিন।":"";
  if(err){pm.textContent=err;return}
  pm.textContent="";$("save").disabled=true;
  const data={name,age,gender:prof.gender,marital:prof.marital,phone:user.phoneNumber||null,email:user.email||null,createdAt:serverTimestamp()};
  try{await setDoc(doc(db,"users",user.uid),data,{merge:true});finish(data)}
  catch(e){pm.textContent="সংরক্ষণ করা যায়নি। ইন্টারনেট ও Firestore rules দেখুন।"}
  $("save").disabled=false};

function finish(u){$("dn").textContent="স্বাগতম, "+u.name;window.__tzUser=u;show("done")}
$("enter").onclick=()=>{location.href="Tazkiyah_v01_test.html"};
window.tzSignOut=()=>signOut(auth).then(()=>location.reload());
</script>
